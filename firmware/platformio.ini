; =============================================================================
;  Campionatore IR — ESP32-S3 WROOM
;
;  Compilazione firmware ........ pio run
;  Upload firmware .............. pio run -t upload
;  Upload Web App (LittleFS) .... pio run -t uploadfs
;  Monitor seriale .............. pio device monitor
;
;  ATTENZIONE: "uploadfs" riscrive l'intera partizione LittleFS, compreso
;  /remotes.json. Prima di aggiornare la Web App esporta un backup dal menu ⋮.
; =============================================================================

[platformio]
default_envs = esp32s3

[env]
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.7.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Se colleghi la scheda alla porta "USB" nativa (non "UART/COM"),
    ; decommenta la riga seguente per vedere i log sul monitor seriale.
    ; -DARDUINO_USB_CDC_ON_BOOT=1

; --- Configurazione principale: Arduino-ESP32 core 3.x (pioarduino) ---------
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; Moduli con 8 MB di flash (WROOM-1 N8 / N8R2 / N8R8).
; Per 16 MB (N16R8): flash_size = 16MB e partizioni default_16MB.csv
; Per  4 MB (N4):    flash_size = 4MB  e partizioni default.csv
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; PSRAM (facoltativa, utile con molti codici da condizionatore):
;   moduli R8 (PSRAM octal):  board_build.arduino.memory_type = qio_opi
;                             e aggiungi -DBOARD_HAS_PSRAM ai build_flags
;   moduli R2 (PSRAM quad):   aggiungi solo -DBOARD_HAS_PSRAM
; Il firmware rileva la PSRAM a runtime e la usa per il database JSON.
